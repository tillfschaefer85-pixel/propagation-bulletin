# Laender mit nur EINER Sendeanlage.
#
# Die EiBi-README sagt es ausdruecklich: "No such code is used if there is
# only one transmitter site in that country." Ein leeres Standortfeld ist
# dort also keine Luecke, sondern eine Aussage. Fuer diese Laender ist die
# Koordinate damit eindeutig - das ist kein Raten.
#
# Wichtig: Nur Laender aufnehmen, fuer die die README tatsaechlich einen
# einzigen Standort (oder einen ausdruecklichen Regelfall mit "except")
# auffuehrt. Wo mehrere Anlagen gelistet sind - Rumaenien, Zypern, Mali -
# bleibt ein leeres Feld weiterhin unaufloesbar.
