# Sendestandort-Koordinaten fuer EiBi-Eintraege.
#
# EiBi liefert je Sendung nur einen Standort-CODE (Feld 8, z.B. "n" fuer
# Nauen), keine Koordinate. Diese Datei bildet "<ITU-Code>-<Site-Code>"
# auf Lat/Lon ab. Alle Werte stammen woertlich aus der offiziellen
# EiBi-README (http://www.eibispace.de/dx/README.TXT, Abschnitt IV,
# "Transmitter site codes") und wurden von Grad/Minuten/Sekunden in
# Dezimalgrad umgerechnet - keine geschaetzten oder erfundenen Werte.
#
# Deckt bewusst nur Europa plus HCJB Ecuador ab - das sind die Sender,
# die bei einem Empfaenger in Bergheim am haeufigsten und am
# verlaesslichsten drankommen. Bekannte, noch fehlende grosse Bloecke:
# USA (WRMI, WTWW, WBCQ - alle tauchten schon im Testlauf auf), Russland,
# China, Japan, Korea, der Grossteil von Afrika, Asien und Suedamerika
# ausserhalb Ecuadors. Fehlt ein Standort hier, wird der betroffene
# EiBi-Eintrag beim Bau uebersprungen und mitgezaehlt statt mit einer
# geratenen Koordinate weiterzurechnen - die Tabelle waechst dann, wenn
# ein uebersprungener Sender haeufig auftaucht.
#
# Ein leerer Standort-Code in EiBi (Feld 8) bedeutet laut README entweder
# "nur ein Sender im Land" oder "Standort unbekannt" - beides wird hier
# nicht geraten, sondern ebenfalls uebersprungen.

