#   power_kw         Sendeleistung
#   language         de | en | fr | nl  (oder weglassen, wenn unbekannt/anders)
#   rarity_baseline  0.0 = allgegenwaertiges Dickschiff, 1.0 = sehr selten/schwierig
#   notes            frei, z.B. Deine eigenen Empfangsnotizen

