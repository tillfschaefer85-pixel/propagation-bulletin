name: Bulletin bauen

# Der Morgenlauf. Rechnet den planbaren Teil (Sendeplaene, Grauzone,
# Sonnenstaende, Bewertung je Kp-Stufe) und committet das Ergebnis nach
# docs/ - der Commit IST die Veroeffentlichung, weil GitHub Pages von
# dort ausliefert.
#
# Warum zwei Cron-Zeilen: Cron laeuft in UTC und kennt keine Sommerzeit.
# 03:15 UTC entspricht 05:15 Sommerzeit, 04:15 UTC entspricht 05:15
# Winterzeit. Welche der beiden tatsaechlich durchlaeuft, entscheidet
# der Torwaechter im Job - sonst liefe der Bau das halbe Jahr zur
# falschen Stunde und in den Umstellungswochen zweimal.

# Die Minutenangaben sind bewusst krumm: zur vollen und halben Stunde
# drängen sich die Zeitpläne der halben Welt, dort sind Verzögerungen und
# ganz ausgefallene Läufe am häufigsten. Ändert man sie, müssen die Werte
# bei --summer-cron und --winter-cron mitgeändert werden - ein Test in
# tests/test_guard.py wacht darüber.

on:
  schedule:
    - cron: "13 3 * * *"   # 05:13 deutscher Sommerzeit
    - cron: "13 4 * * *"   # 05:13 deutscher Winterzeit
  workflow_dispatch:       # zum Ausprobieren von Hand, ohne auf morgen zu warten

# Der Job schreibt in sein eigenes Repository.
permissions:
  contents: write

# Zwei gleichzeitige Baulaeufe wuerden sich beim Push gegenseitig
# abschiessen. Der laufende darf zu Ende laufen.
concurrency:
  group: bulletin-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Zeitfenster pruefen
        id: guard
        # Entschieden wird anhand der Cron-Zeile, die diesen Lauf ausgeloest
        # hat - nicht anhand der Uhrzeit. Geplante Laeufe starten unter Last
        # regelmaessig verspaetet, und eine Pruefung per Zeitfenster muss
        # unter 60 Minuten Toleranz bleiben, sonst kaeme die jeweils andere
        # Zeile mit durch. Ein Lauf mit 50 Minuten Verzug waere so still
        # verworfen worden, obwohl er der richtige war.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Von Hand gestartet - Zeitplan wird nicht geprueft."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif PYTHONPATH=src python3 -m bulletin.guard \
                 --at "05:13" \
                 --schedule "${{ github.event.schedule }}" \
                 --summer-cron "13 3 * * *" \
                 --winter-cron "13 4 * * *"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Python einrichten
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Tests laufen lassen
        if: steps.guard.outputs.run == 'true'
        # Bewusst VOR dem Bau: lieber ein Tag ohne frisches Bulletin als
        # ein Bulletin, das aus kaputtem Code entstanden ist.
        run: PYTHONPATH=src python -m unittest discover -s tests

      - name: Bulletin bauen
        if: steps.guard.outputs.run == 'true'
        run: PYTHONPATH=src python -m bulletin.build

      - name: Ergebnis committen
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "bulletin-bot"
          git config user.email "bulletin-bot@users.noreply.github.com"
          git add docs/
          # Ohne diese Pruefung scheitert der Lauf an Tagen, an denen sich
          # tatsaechlich nichts geaendert hat.
          if git diff --staged --quiet; then
            echo "Keine Aenderung - nichts zu committen."
          else
            git commit -m "Bulletin fuer $(TZ=Europe/Berlin date +%F)"
            # Der Weltraumwetter-Lauf schreibt in dasselbe Repository und
            # kann sich mit diesem hier ueberschneiden. Ohne Rebase
            # scheitert der zweite Push mit "non-fast-forward" - und der
            # Lauf faellt aus einem Grund aus, der nichts mit dem Bulletin
            # zu tun hat.
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "Push abgelehnt, Versuch $attempt - hole Aenderungen und versuche erneut."
              git pull --rebase origin "${GITHUB_REF_NAME}"
              sleep 5
            done
          fi
