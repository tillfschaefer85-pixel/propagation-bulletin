name: Push verschicken

# Der Abendlauf um 20:30 Ortszeit. Liest nur das fertige Bulletin, holt
# den aktuellen Kp-Wert und verschickt eine Nachricht - kein Commit,
# keine Rechnung, Laufzeit unter zehn Sekunden.
#
# Zwei Cron-Zeilen aus demselben Grund wie beim Bau: 18:30 UTC ist
# 20:30 Sommerzeit, 19:30 UTC ist 20:30 Winterzeit.

# Die Minutenangaben sind bewusst krumm: zur vollen und halben Stunde
# drängen sich die Zeitpläne der halben Welt, dort sind Verzögerungen und
# ganz ausgefallene Läufe am häufigsten. Ändert man sie, müssen die Werte
# bei --summer-cron und --winter-cron mitgeändert werden - ein Test in
# tests/test_guard.py wacht darüber.

on:
  schedule:
    - cron: "32 18 * * *"  # 20:32 deutscher Sommerzeit
    - cron: "32 19 * * *"  # 20:32 deutscher Winterzeit
  workflow_dispatch:

# Nur lesen. Dieser Lauf hat keinen Grund, irgendetwas zu veraendern.
permissions:
  contents: read

concurrency:
  group: bulletin-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Zeitfenster pruefen
        id: guard
        # Entschieden wird anhand der Cron-Zeile, die diesen Lauf ausgeloest
        # hat - nicht anhand der Uhrzeit. Geplante Laeufe starten unter Last
        # regelmaessig verspaetet, und eine Pruefung per Zeitfenster muss
        # unter 60 Minuten Toleranz bleiben, sonst kaeme die jeweils andere
        # Zeile mit durch. Ein Lauf mit 50 Minuten Verzug waere so still
        # verworfen worden, obwohl er der richtige war.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Von Hand gestartet - Zeitplan wird nicht geprueft."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif PYTHONPATH=src python3 -m bulletin.guard \
                 --at "20:32" \
                 --schedule "${{ github.event.schedule }}" \
                 --summer-cron "32 18 * * *" \
                 --winter-cron "32 19 * * *"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Python einrichten
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Push verschicken
        if: steps.guard.outputs.run == 'true'
        env:
          # NTFY_TOPIC ist faktisch das Passwort - bei ntfy gibt es keine
          # Anmeldung, wer den Namen kennt, liest mit. Deshalb als Secret
          # und nicht als Variable, und bitte nichts Erratbares.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PAGE_URL: ${{ vars.PAGE_URL }}
        run: PYTHONPATH=src python -m bulletin.notify
